name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ClipJoiner.apk
          ls -l ClipJoiner.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs ClipJoiner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClipJoiner-apk
          path: ClipJoiner.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  emulator:
    name: Merge tests on an emulator + ffprobe checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Generate test clips
        run: scripts/make_test_clips.sh app/src/androidTest/assets/clips

      - name: Build app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run merge tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: scripts/emulator_tests.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-output
          path: test-output/
          if-no-files-found: ignore

  release:
    name: Publish APK
    needs: [build, emulator]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClipJoiner-apk
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ClipJoiner.apk \
            --target "$GITHUB_SHA" \
            --title "Clip Joiner (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Passed unit tests and the emulator merge tests. Download ClipJoiner.apk on your phone and open it to install."
